services:
  postgres:
    image: postgres:16-alpine
    container_name: pool_postgres
    environment:
      POSTGRES_DB: pool_db
      POSTGRES_USER: pool_user
      POSTGRES_PASSWORD: pool_password
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pool_user -d pool_db" ]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build: .
    container_name: pool_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pool_db
      SPRING_DATASOURCE_USERNAME: pool_user
      SPRING_DATASOURCE_PASSWORD: pool_password
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: