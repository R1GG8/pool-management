spring.application.name=pool-management

# Подключение к PostgreSQL из docker-compose
spring.datasource.url=jdbc:postgresql://localhost:5439/pool_db
spring.datasource.username=pool_user
spring.datasource.password=pool_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Настройки пула соединений HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# Настройки Flyway миграций
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Бизнес-параметры бассейна
pool.capacity-per-hour=10
pool.working-hours.open=08:00
pool.working-hours.close=22:00